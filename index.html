<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pace Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --track: #171613;
    --track-2: #201e19;
    --chalk: #F2EEE4;
    --chalk-dim: #9C978C;
    --red: #C8432B;
    --red-dim: #7a2c1e;
    --lane: #E0AC1F;
    --line: #33302a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --track: #171613;
      --track-2: #201e19;
      --chalk: #F2EEE4;
      --chalk-dim: #9C978C;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--track);
    color: var(--chalk);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 78px, var(--track-2) 78px, var(--track-2) 80px);
    opacity: .5;
    pointer-events: none;
    z-index: 0;
  }
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 30px;
  }
  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .lane-num {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--lane);
    letter-spacing: 0.04em;
  }
  .tabs {
    display: flex;
    gap: 8px;
    background: var(--track-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 5px;
    margin-bottom: 26px;
  }
  .tab {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--chalk-dim);
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 14px 0;
    border-radius: 7px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .tab.active {
    background: var(--red);
    color: var(--chalk);
  }
  .field-label {
    font-size: 13px;
    color: var(--chalk-dim);
    margin-bottom: 10px;
  }
  .time-input {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
  }
  .time-input input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    color: var(--chalk);
    font-family: 'Oswald', sans-serif;
    font-size: 44px;
    font-weight: 600;
    text-align: center;
    padding: 6px 0 10px;
    -moz-appearance: textfield;
    transition: border-color .2s ease;
  }
  .time-input input::-webkit-outer-spin-button,
  .time-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .time-input input:focus { outline: none; border-color: var(--red); }
  .time-input .colon {
    font-family: 'Oswald', sans-serif;
    font-size: 34px;
    color: var(--chalk-dim);
    padding-bottom: 12px;
  }
  .sub-label {
    text-align: center;
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: -18px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-around;
  }
  .result {
    margin-top: 30px;
    border-top: 1px solid var(--line);
    padding-top: 26px;
    text-align: center;
  }
  .result-label {
    font-size: 12px;
    color: var(--chalk-dim);
    margin-bottom: 6px;
  }
  .result-value {
    font-family: 'Oswald', sans-serif;
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    color: var(--chalk-dim);
    transition: color .2s ease, font-size .2s ease;
  }
  .result-value.ready {
    color: var(--lane);
  }
  .result-value.placeholder {
    font-size: 26px;
    font-weight: 500;
  }
  .result-unit {
    font-size: 15px;
    color: var(--chalk-dim);
    margin-top: 8px;
    visibility: hidden;
  }
  .result-unit.show { visibility: visible; }
  @media (prefers-reduced-motion: reduce) {
    .result-value { transition: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="title-row">
      <h1>Pace Split</h1>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" id="tab5k" data-dist="5" role="tab" aria-selected="true">5K</button>
      <button class="tab" id="tab3k" data-dist="3" role="tab" aria-selected="false">3K</button>
    </div>

    <div class="field-label" id="fieldLabel">5K finish time</div>
    <div class="time-input">
      <input type="number" id="mins" inputmode="numeric" min="0" max="59" placeholder="00" />
      <span class="colon">:</span>
      <input type="number" id="secs" inputmode="numeric" min="0" max="59" placeholder="00" />
    </div>
    <div class="sub-label"><span>minutes</span><span>seconds</span></div>

    <div class="result" id="result">
      <div class="result-label">average pace</div>
      <div class="result-value placeholder" id="paceVal">enter a time</div>
      <div class="result-unit" id="resultUnit">per mile</div>
    </div>
  </div>

<script>
  const MILES = { 5: 3.10686, 3: 1.86411 }; // miles per distance (km)
  let distance = 5;

  const minsEl = document.getElementById('mins');
  const secsEl = document.getElementById('secs');
  const resultEl = document.getElementById('result');
  const paceValEl = document.getElementById('paceVal');
  const resultUnitEl = document.getElementById('resultUnit');
  const fieldLabelEl = document.getElementById('fieldLabel');
  const tab5k = document.getElementById('tab5k');
  const tab3k = document.getElementById('tab3k');

  function setDistance(d) {
    distance = d;
    tab5k.classList.toggle('active', d === 5);
    tab3k.classList.toggle('active', d === 3);
    tab5k.setAttribute('aria-selected', d === 5);
    tab3k.setAttribute('aria-selected', d === 3);
    fieldLabelEl.textContent = d + 'K finish time';
    calc();
  }
  tab5k.addEventListener('click', () => setDistance(5));
  tab3k.addEventListener('click', () => setDistance(3));

  function showPlaceholder() {
    paceValEl.textContent = 'enter a time';
    paceValEl.classList.add('placeholder');
    paceValEl.classList.remove('ready');
    resultUnitEl.classList.remove('show');
  }

  function calc() {
    const mComplete = minsEl.value.length === 2;
    const sComplete = secsEl.value.length === 2;

    if (!mComplete || !sComplete) {
      showPlaceholder();
      return;
    }

    const m = parseInt(minsEl.value, 10) || 0;
    const s = Math.min(parseInt(secsEl.value, 10) || 0, 59);

    const totalSeconds = m * 60 + s;
    const paceSecondsPerMile = totalSeconds / MILES[distance];
    const roundedTotal = Math.round(paceSecondsPerMile);
    const pMin = Math.floor(roundedTotal / 60);
    const pSec = roundedTotal % 60;

    paceValEl.textContent = pMin + ':' + String(pSec).padStart(2, '0');
    paceValEl.classList.remove('placeholder');
    paceValEl.classList.add('ready');
    resultUnitEl.classList.add('show');
  }

  [minsEl, secsEl].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') calc(); });
  });

  minsEl.addEventListener('input', () => {
    if (minsEl.value.length > 2) minsEl.value = minsEl.value.slice(0, 2);
    if (minsEl.value.length === 2) secsEl.focus();
    calc();
  });
  secsEl.addEventListener('input', () => {
    if (secsEl.value.length > 2) secsEl.value = secsEl.value.slice(0, 2);
    if (secsEl.value.length === 2) secsEl.blur();
    calc();
  });
  secsEl.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && secsEl.value === '') {
      e.preventDefault();
      minsEl.focus();
      minsEl.value = minsEl.value.slice(0, -1);
      calc();
    }
  });

  window.addEventListener('DOMContentLoaded', () => minsEl.focus());
  minsEl.focus();
</script>
</body>
</html>
